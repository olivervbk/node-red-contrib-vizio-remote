<script type="text/javascript">
  RED.nodes.registerType('vizio-status', {
    category: 'Vizio',
    color: '#9fc5e8',
    defaults: { name: { value: '' }, tv: { type: 'vizio-tv', required: true } },
    inputs: 1, outputs: 1, icon: 'font-awesome/fa-info-circle',
    label: function () { return this.name || 'Vizio status'; }
  });
</script>

<script type="text/html" data-template-name="vizio-status">
  <div class="form-row"><label for="node-input-name"><i class="fa fa-tag"></i> Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-tv"><i class="fa fa-television"></i> TV</label><input type="text" id="node-input-tv"></div>
</script>

<script type="text/html" data-help-name="vizio-status">
  <p>Reads the TV state when a message arrives.</p>
  <pre>msg.payload = { power: true, input: "HDMI-3", inputLabel: "HTPC", volume: 30, muted: false }</pre>
  <p>When the TV is off only <code>{ power: false }</code> is returned.</p>
</script>
