<script type="text/javascript">
  RED.nodes.registerType('vizio-command', {
    category: 'Vizio',
    color: '#9fc5e8',
    defaults: {
      name: { value: '' },
      tv: { type: 'vizio-tv', required: true },
      action: { value: 'msg' },
      amount: { value: '1' }, amountType: { value: 'num' },
      volume: { value: '' }, volumeType: { value: 'num' },
      input: { value: '' }, inputType: { value: 'str' },
      codeset: { value: '' },
      code: { value: '' }
    },
    inputs: 1, outputs: 1, icon: 'font-awesome/fa-television',
    label: function () { return this.name || ('Vizio: ' + (this.action || '').replace(/_/g, ' ')); },
    oneditprepare: function () {
      var types = ['num', 'msg', 'flow', 'global', 'env'];
      $('#node-input-amount').typedInput({ types: types, typeField: '#node-input-amountType' });
      $('#node-input-volume').typedInput({ types: types, typeField: '#node-input-volumeType' });
      $('#node-input-input').typedInput({ types: ['str', 'msg', 'flow', 'global', 'env'], typeField: '#node-input-inputType' });
      var sync = function () {
        var a = $('#node-input-action').val();
        var msgMode = a === 'msg';
        $('.vz-amount').toggle(msgMode || a === 'volume_up' || a === 'volume_down');
        $('.vz-volume').toggle(msgMode || a === 'volume_set');
        $('.vz-input').toggle(msgMode || a === 'input_set');
        $('.vz-raw').toggle(msgMode || a === 'key');
      };
      $('#node-input-action').on('change', sync); sync();
    }
  });
</script>

  <div class="form-row vz-volume"><label for="node-input-volume"><i class="fa fa-volume-up"></i> Volume</label><input type="text" id="node-input-volume" style="width:70%"><input type="hidden" id="node-input-volumeType"></div>
  <div class="form-row vz-input"><label for="node-input-input"><i class="fa fa-plug"></i> Input</label><input type="text" id="node-input-input" style="width:70%"><input type="hidden" id="node-input-inputType"></div>
  <div class="form-row vz-raw"><label for="node-input-codeset">Codeset</label><input type="number" id="node-input-codeset" style="width:80px"> <label for="node-input-code" style="width:auto">Code</label> <input type="number" id="node-input-code" style="width:80px"></div>
</script>

<script type="text/html" data-help-name="vizio-command">
  <p>Sends a command to a Vizio SmartCast TV.</p>
  <h3>Action</h3>
  <p>Pick a fixed action, or <b>(from msg.payload)</b> to choose it per message. In that mode <code>msg.payload</code> is a string
  (<code>"PowerOn"</code>, <code>"power_off"</code>, <code>"volume up"</code> – case, spaces, dashes and underscores don't matter)
  or an object. A fixed action ignores string payloads.</p>
  <h3>Parameters</h3>
  <p>Amount, volume and input can each be a fixed value or read from <code>msg</code>, <code>flow</code>, <code>global</code> or an environment variable.
  Keys in an object <code>msg.payload</code> always override them:</p>
  <pre>{ "action": "volume_up", "amount": 5 }
{ "action": "volume_set", "volume": 25 }
{ "action": "input_set", "input": "HDMI-2" }   // or "SmartCast", or your own label
{ "action": "key", "codeset": 5, "code": 1 }</pre>
  <p>A bare number as payload sets the amount (volume up/down) or the volume (set volume).</p>
  <h3>Output</h3>
  <p><code>msg.payload</code> = <code>{ ok: true, action, … }</code>. Errors go to Catch nodes.</p>
  <p>Volume up/down ×N sends N key presses ~100 ms apart. Power on only works if the TV keeps its network up while off (enable Quick Start). There is no "stop" key in the SmartCast API.</p>
</script>
